<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2723">
<meta name="description" content="Okpotani General Hardware business records with optional multi-device cloud sync.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>Okpotani General Hardware</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#22201c;--mut:#6b655b;--line:#ddd6ca;--acc:#f28c00;--accink:#2a1700;--head:#2b2723;--headink:#fff;--ok:#18794e;--bad:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#242120;--ink:#efeae2;--mut:#a39b8d;--line:#3a3530;--head:#0f0e0d;--ok:#4cc38a;--bad:#ff7a6b}}
:root[data-theme="dark"]{--bg:#171513;--card:#242120;--ink:#efeae2;--mut:#a39b8d;--line:#3a3530;--head:#0f0e0d;--ok:#4cc38a;--bad:#ff7a6b}
*{box-sizing:border-box}html{height:100%}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:relative;background:var(--head);color:var(--headink);padding:12px 54px 10px 16px}#hb{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;border:2px solid var(--acc);background:none;color:var(--headink);font-weight:800;font-size:17px;cursor:pointer}details{background:var(--card);border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;padding:0 14px}summary{padding:12px 0;font-weight:700;cursor:pointer}details ol,details ul{padding-left:20px;margin:0 0 12px}details li{margin-bottom:6px}details p{margin:0 0 12px}
h1{margin:0;font-size:19px}h1:before{content:"";display:inline-block;width:14px;height:14px;background:var(--acc);margin-right:8px;transform:rotate(45deg) scale(.8)}
header small{opacity:.75;font-size:12.5px}
h2{margin:12px 0 8px;font-size:19px}h3{margin:12px 0 6px;font-size:14px;color:var(--mut)}
main{flex:1;overflow:auto;padding:12px 14px;width:100%;max-width:960px;margin:0 auto}
.hide{display:none!important}
input,select,textarea{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);margin:0 0 10px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
label{font-size:13px;color:var(--mut);display:block;margin:0 0 3px}
.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:6px;cursor:pointer}
.nm{flex:1;min-width:0}.item b{display:block;overflow-wrap:anywhere}small{color:var(--mut)}
.pr{font-weight:700;white-space:nowrap;text-align:right}.low{color:var(--bad);font-weight:700}.ok{color:var(--ok)}
nav{display:flex;background:var(--card);border-top:1px solid var(--line)}
nav button{flex:1;padding:12px 1px;border:0;background:none;font-weight:700;font-size:13px;color:var(--mut);border-top:4px solid transparent;cursor:pointer}
nav button.on{color:var(--ink);border-top-color:var(--acc)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.stat small{display:block}.stat .num{font-size:20px;font-weight:800}
.stat[role=button]{cursor:pointer;transition:transform .1s}.stat[role=button]:hover{border-color:var(--acc)}.stat[role=button]:active{transform:scale(.97)}.stat.wide{grid-column:1/-1;background:var(--head);color:var(--headink);border-color:var(--head)}.stat.wide small{color:#cfc8bb}
.btn{display:block;width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);font-weight:700;margin-top:8px;cursor:pointer}
.btn.big{background:var(--acc);color:var(--accink);border-color:var(--acc);font-size:17px}.btn.del{color:var(--bad)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.seg button{flex:1;min-width:30%;padding:9px 2px;font-size:13.5px;border:1.5px solid var(--line);border-radius:99px;background:var(--card);font-weight:700;cursor:pointer}.seg button.on{background:var(--acc);border-color:var(--acc);color:var(--accink)}
.empty{color:var(--mut);text-align:center;padding:20px}
.bars{display:flex;align-items:flex-end;gap:6px;height:90px;margin:6px 0 4px}.bars div{flex:1;background:var(--acc);border-radius:4px 4px 0 0;min-height:2px}
.lab{display:flex;gap:6px}.lab small{flex:1;text-align:center;font-size:11px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px;background:var(--card)}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-size:12px}
.qty{display:flex;gap:6px}.qty input{margin:0;padding:8px}
#md{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:9}
#md>div{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
#rc pre{font:13px/1.35 ui-monospace,Menlo,monospace;white-space:pre-wrap;background:#fff;color:#000;padding:10px;border-radius:8px;margin:0}
#cb{position:fixed;right:14px;bottom:calc(66px + env(safe-area-inset-bottom,0px));width:50px;height:50px;border-radius:50%;border:0;background:var(--acc);color:var(--accink);font-size:23px;box-shadow:0 2px 8px #0006;z-index:5;cursor:pointer}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.kp button{padding:15px 0;font-size:21px;font-weight:700;border:1.5px solid var(--line);border-radius:10px;background:var(--card);cursor:pointer}.kp .op{background:var(--acc);border-color:var(--acc);color:var(--accink)}.kp .fn{color:var(--bad)}
@media print{.rcp.p58{width:58mm!important;max-width:58mm!important;padding:1mm 3mm!important;margin:0!important}}
.rcp.p58{width:58mm;max-width:58mm;padding:2mm 3mm;font-size:11px;border-radius:0;box-sizing:border-box}.rcp.p58 .nm{font-size:13px}.rcp.p58 .ttl{margin:5px 0 3px;letter-spacing:2px}.rcp.p58 table{font-size:11px}.rcp.p58 .ab{font-size:9.5px}.rcp.p58 .mt td:first-child{width:auto}.rcp .it2 td{padding:1px 0}.rcp .it2 td[colspan]{text-align:left!important}.rcp.p58 .lg img{display:block;margin:0 auto}
.tw tr.tap{cursor:pointer}.tw tr.tap td:first-child{color:var(--acc);font-weight:700;text-decoration:underline dotted}.tw tr.tap:hover td{background:rgba(242,140,0,.12)}.tw tr.tap:active td{background:rgba(242,140,0,.22)}
@media print{#cb,.np,#ts{display:none!important}.rcp{max-width:none!important;border-radius:0!important;padding:0!important}}
.rcp{background:#fff;color:#000;font:13px/1.35 Arial,Helvetica,sans-serif;padding:14px;border-radius:8px;max-width:380px;margin:0 auto}.rcp .lg{text-align:center}.rcp .lg svg,.rcp .lg img{display:inline-block}.rcp .nm{text-align:center;font-weight:800;font-size:16px;letter-spacing:.5px;margin-top:4px}.rcp .tg{text-align:center;font-size:11.5px;font-style:italic}.rcp .ad{text-align:center;font-size:11.5px;margin-top:2px}.rcp .ttl{text-align:center;font-weight:800;letter-spacing:3px;margin:8px 0 4px;border-top:2px solid #000;border-bottom:2px solid #000;padding:3px 0}.rcp table{width:100%;background:transparent;font-size:13px;border-collapse:collapse}.rcp td,.rcp th{border:0;padding:2px 0;white-space:normal;color:#000;text-align:left;background:transparent;font-size:inherit}.rcp th{font-size:11px;border-bottom:1px solid #000}.rcp td:last-child,.rcp th:last-child{text-align:right}.rcp .it td:nth-child(2),.rcp .it th:nth-child(2),.rcp .it td:nth-child(3),.rcp .it th:nth-child(3){text-align:right;padding-left:8px}.rcp .tt td{font-weight:700}.rcp .mt td:first-child{width:92px}.rcp hr.ds{border:0;border-top:1px dashed #000;margin:7px 0}.rcp .ab{font-size:10.5px;text-align:center}.rcp .ft{text-align:center;font-weight:700;margin-top:6px}
#ts{position:fixed;left:50%;bottom:calc(122px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--head);color:var(--headink);padding:10px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:20;font-weight:700;box-shadow:0 2px 10px #0006}#ts.show{opacity:1;transform:translate(-50%,0)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes sl{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
main>*{animation:up .22s ease both}#md>div{animation:sl .22s ease}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#pv{background:#fff;color:#000;border-radius:10px;padding:14px;margin:10px 0}#pv h2,#pv h3,#pv h4{margin:4px 0;color:#000}#pv table{background:#fff;color:#000;font-size:14px}#pv td{white-space:normal;padding:5px 4px;border-bottom:1px solid #ccc}#pv td:last-child{text-align:right;font-weight:700;white-space:nowrap}#pv td:nth-child(2){text-align:left;color:#555}.pcat{break-inside:avoid;margin-bottom:10px}.pcat h4{background:#f28c00;color:#2a1700!important;padding:3px 6px}.chk{display:flex;gap:8px;align-items:center;margin:0 0 6px}.chk input{width:auto;margin:0}
@media print{body *{visibility:hidden}#rc,#rc *,#gd,#gd *,#pv,#pv *{visibility:visible}#rc,#gd,#pv{position:absolute;left:0;top:0;width:100%}#hb{display:none}html,body{height:auto!important;display:block!important}main{overflow:visible!important;padding:0!important;max-width:none!important}.pc{column-count:2;column-gap:16px}#pv{margin:0;border-radius:0}}

V.help=()=>'<div id="gd"><h2>How to use this system</h2><small>Tap a heading to open it.</small><details><summary>1. First-time setup</summary><ol><li>Go to <b>Setup</b>, enter your shop name, address and phone number (they appear on receipts) and tap <b>Save settings</b>.</li><li>Under <b>Receipt look</b> in Setup you can change the tagline, the about text, the closing message and the logo (or upload your own logo picture).</li><li>Set the <b>Mobile Money charge %</b> if your supplier payments usually cost a known percentage. You can still type the exact fee on each purchase.</li><li>Check your products under <b>Stock</b>. Tap a product to correct its price, <b>opening stock</b>, reorder level, and the usual transport and handling cost per unit.</li><li>If you are starting fresh, use <b>Setup → Clear transactions</b> to remove sample records. Your products stay.</li><li>Take your first backup: <b>Setup → Download backup file</b>.</li></ol></details><details open><summary>2. Your day, step by step</summary><ol><li><b>Morning:</b> open the system. Check <b>Home</b> for items to reorder and money owed to you.</li><li><b>Stock arrives:</b> record it under <b>Money → Purchases</b>.</li><li><b>Every sale:</b> record it on <b>Sell</b>.</li><li><b>Customers paying old debts:</b> <b>Money → Credit</b>.</li><li><b>Spending:</b> record each expense under <b>Money → Expenses</b>.</li><li><b>Evening:</b> count the cash and close the day in <b>Money → Cash book</b>. Then download a backup.</li></ol></details><details><summary>3. Making a sale (one or many products)</summary><ol><li>Tap <b>Sell</b> and search a product. Tap it to add it to the cart. Search and tap again for each extra product.</li><li>Change the <b>quantity</b> (left box) or <b>price</b> (right box) on any line. Tap <b>remove</b> to take a line out.</li><li>Type the customer name (needed for credit) and choose <b>Cash</b>, <b>Mobile Money</b> or <b>Credit</b>.</li><li>Choose <b>Served by</b> (add your staff names in <b>Setup</b> first). The time is recorded automatically when you tap Complete sale, or type another time.</li><li>Tap <b>Complete sale</b>. The receipt opens with the date, time and who served the customer. Tap <b>Print</b> or <b>Share on WhatsApp</b>.</li><li>Printing on a 58mm Bluetooth printer? In <b>Setup → Receipt look</b> set <b>Receipt paper</b> to <b>58mm thermal printer</b>, then tap Print and choose your printer.</li><li>Stock goes down automatically.</li></ol></details><details><summary>4. Customer buys on credit or pays part</summary><ol><li>On <b>Sell</b>, choose <b>Credit</b>. A box appears: <b>Amount paid now</b>. Enter what the customer paid, or leave it empty.</li><li>The receipt shows <b>Paid so far</b> and <b>Balance</b>.</li><li>When they pay more later: <b>Money → Credit</b>, tap the customer, enter the amount and date.</li><li>When the balance reaches zero, the customer leaves the Credit list.</li></ol></details><details><summary>5. Customer advances (pays now, collects later)</summary><ol><li><b>Money → Advances → New advance</b>. Enter the customer, the goods reserved and the amount paid. Set the goods aside.</li><li>When the customer comes, open the advance and tap <b>Customer is collecting goods now</b>. This opens Sell. Add the products and complete the sale. The advance is deducted automatically.</li><li>Advances are held money, not sales, until the customer collects.</li></ol></details><details><summary>6. Recording stock you buy (true cost)</summary><ol><li><b>Money → Purchases → + Record stock arriving</b>.</li><li>Fill in the date, supplier, product, quantity and the <b>unit cost at the supplier</b>. To find the product quickly, type part of its name in the search box above the Product list. The matching products appear and the first one is selected.</li><li>Check <b>Transport per unit</b> and <b>Handling per unit</b>. They fill in automatically for cement, iron bars, iron sheets and floor carpet. Change them if needed.</li><li>Choose how you paid the supplier. For Mobile Money, enter the <b>mobile money charge</b> (leave 0 to use the Setup %). Use <b>Other costs</b> for errands and packaging, as a total.</li><li>The system adds all these to the cost of the goods. Your profit on every later sale uses this real cost.</li><li>Made a mistake? Tap the purchase in the list to edit or delete it.</li></ol></details><details><summary>7. Buying from a supplier on credit</summary><ol><li>In the purchase form, set <b>Payment to supplier</b> to <b>On credit</b>, type the supplier name, and enter any deposit in <b>Amount paid to supplier now</b>.</li><li>See what you owe under <b>Money → Suppliers</b>.</li><li>To pay: tap the supplier, then <b>Pay supplier</b>. Enter the amount and any Mobile Money charge. Payments settle the oldest purchases first.</li></ol></details><details><summary>8. Expenses</summary><ol><li><b>Money → Expenses → + Add expense</b>. Choose the type, add a description and the amount.</li><li>Record only <b>business</b> costs here (transport, wages, rent, airtime). Do not record stock purchases here, and do not record personal spending here.</li></ol></details><details><summary>9. Daily cash book and closing</summary><ol><li><b>Money → Cash book</b> shows, for the chosen date, the Cash box and Mobile Money: opening balance, money in, money out and the balance expected.</li><li>Count the cash, tap <b>Close the day</b>, and type the amount counted. The system shows <b>Short by</b> or <b>Over by</b>.</li><li>Tomorrow opens with today\'s counted cash.</li><li>Leave the Mobile Money balance empty if you are not tracking it yet.</li><li>Use <b>+ Owner drawings / transfer / other</b> for: owner drawings, deposits from the cash box to Mobile Money, withdrawals back, money you put in, and other money in or out.</li></ol></details><details><summary>10. Taking money for personal use</summary><ol><li>Record it as <b>Owner drawings (personal use)</b> in the Cash book. It is not an expense, so your profit stays true.</li><li>Reports shows <b>Owner drawings</b> and <b>Profit after owner drawings</b>. If the second figure is red, you are taking more than the shop earns.</li><li>Take a fixed amount on a fixed day, and count the box before you take it.</li></ol></details><details><summary>11. Stock page</summary><ol><li>Search a product by name. Each line shows price, cost, profit per unit, <b>stock profit</b> (profit on all you hold) and the quantity, marked LOW or CHECK when needed.</li><li>Tap a product to edit it, then <b>View stock history</b> to see the opening stock, every restock and every sale with a running total.</li><li>The top cards show stock value at cost, at selling price, and potential gross profit.</li></ol></details><details><summary>12. Reports: what each card means</summary><ol><li>Use <b>Monthly</b> or <b>Daily report</b> at the top. The daily report shows one day: sales, profit, expenses, stock received, receipts and cash book status. You can print it.</li><li>For the monthly view, pick the month.</li><li><b>Net profit:</b> sales minus cost of goods minus expenses.</li><li><b>Net revenue:</b> sales minus expenses only.</li><li><b>Owner drawings</b> and <b>Profit after owner drawings</b>: what you took out and what the shop kept.</li><li><b>Cash received:</b> money actually collected. <b>Spent on restocking:</b> cash paid for stock. <b>Owed to suppliers:</b> unpaid supplier balances.</li><li><b>Cash left:</b> cash received minus expenses, restocking and drawings.</li><li>Tap a card to open its records. The daily summary and profit by product are further down. Tap a product in <b>Profit by product</b> to see every sale of it, with the date, time, customer and receipt, for the month or for all dates.</li></ol></details><details><summary>13. Backup, restore and Excel</summary><ol><li><b>Setup → Download backup file:</b> do it every evening. Send the file to yourself on WhatsApp.</li><li><b>Setup → Restore from backup:</b> use it on a new phone, after clearing Chrome, or when you install an updated file.</li><li><b>Setup → Export to Excel:</b> a workbook with sales, products, purchases, expenses, daily summary, product profit, advances, cash book and owner entries.</li><li><b>Setup → Data safety</b> shows whether your records are protected. On Chrome for a computer you can connect an <b>auto-backup file</b> that updates by itself every time you save. The Home page reminds you when no backup was downloaded for 24 hours.</li><li>Your records live inside Chrome on the device. Do not clear Chrome\'s data without a fresh backup, and keep the file in the same folder.</li></ol></details><details><summary>14. Fixing mistakes</summary><ol><li><b>Wrong sale:</b> <b>Sell → Sales history</b>, pick the date, tap the sale, <b>Delete sale</b>. Stock is restored.</li><li><b>Wrong purchase or expense:</b> tap it under <b>Money</b> to edit or delete.</li><li><b>Remove a whole day:</b> <b>Setup → Delete records by date</b>.</li><li><b>Stock looks wrong:</b> open the product and use <b>View stock history</b>. Check the opening stock first.</li></ol></details><details><summary>15. Calculator and shortcuts</summary><ol><li>The round <b>🧮</b> button at the bottom right opens a calculator on any page.</li><li>On <b>Home</b> and <b>Reports</b>, tap a card to jump to its records.</li><li>The <b>?</b> button at the top right brings you back to this guide.</li></ol></details><details><summary>16. Price list for customers</summary><ol><li>Go to <b>Stock → Make price list</b>.</li><li>Type a title and an optional note. Open <b>Choose categories</b> to include only some groups. Tick <b>Only items currently in stock</b> if you want.</li><li>The list below updates as you type. It uses your current selling prices, so change a price on the Stock page and the list follows.</li><li>Tap <b>Print / Save as PDF</b> (choose Save as PDF in the print window to keep a file), <b>Share as text</b> for WhatsApp, or <b>Copy as text</b>.</li></ol></details><details><summary>17. Golden rules</summary><ol><li>Record every sale, purchase and expense on the day it happens.</li><li>Never record a purchase as an expense.</li><li>Count the cash every evening before taking your own money.</li><li>Back up daily, and keep using one device for entering records.</li></ol></details><button class="btn big" onclick="document.querySelectorAll(\'#gd details\').forEach(d=>d.open=true);print()">Print this guide</button><button class="btn" onclick="go(\'home\')">Back to Home</button></div>';

V.price=()=>{const o=db.PL;return'<button class="btn" onclick="go(\'stock\')" style="margin:0 0 6px">← Back to Stock</button><h2>Price list</h2><label>Title</label><input value="'+esc(o.title)+'" oninput="pset(\'title\',this.value)"><label>Note at the bottom (optional)</label><input value="'+esc(o.note)+'" placeholder="e.g. Prices may change without notice" oninput="pset(\'note\',this.value)"><details><summary>Choose categories ('+(o.cats.length||'all')+')</summary>'+catList().map((c,i)=>'<label class="chk"><input type="checkbox" '+(!o.cats.length||o.cats.includes(c)?'checked':'')+' onchange="ptog('+i+')"> '+esc(c)+'</label>').join('')+'<p><small>Nothing ticked = all categories.</small></p></details><label class="chk"><input type="checkbox" '+(o.instock?'checked':'')+' onchange="db.PL.instock=this.checked;save();render()"> Only items currently in stock</label><div id="pv">'+pvh()+'</div><button class="btn big" onclick="print()">Print / Save as PDF</button><button class="btn" onclick="pshare()">Share as text (WhatsApp)</button><button class="btn" onclick="pcopy()">Copy as text</button>'};
function addd(d,n){const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)}
function drep(){const d=st.rd=st.rd||td(),ss=db.S.filter(s=>s.date==d),x=pl(d),by=p=>sum(ss.filter(s=>s.pay==p),tot),col=sum(db.S.filter(s=>s.pay=='Credit'),s=>sum(s.pays.filter(p=>p.d==d),p=>p.a)),adv=sum(db.A.filter(a=>a.date==d),a=>a.amt),buy=db.U.filter(u=>u.date==d),ex=db.X.filter(z=>z.date==d),dr=sum(db.M.filter(z=>z.kind=='draw'&&z.date==d),z=>z.amt),cb=cbexp(d),cl=db.C.find(z=>z.date==d),it={};
ss.forEach(s=>s.items.forEach(i=>{const r=it[i.n]||(it[i.n]={q:0,s:0,p:0});r.q+=i.q;r.s+=i.q*i.p;r.p+=i.q*(i.p-i.c)}));
const sc=(l,v,c)=>'<div class="stat"><small>'+l+'</small><span class="num '+(c||'')+'">'+fm(v)+'</span></div>',ln=(a,b,c,f)=>'<div class="item" style="cursor:'+(f?'pointer':'default')+'"'+(f?' onclick="'+f+'"':'')+'><span class="nm"><b>'+a+'</b><small>'+b+'</small></span><span class="pr">'+c+'</span></div>';
const rows=Object.entries(it).sort((a,b)=>b[1].p-a[1].p);
return'<div class="seg"><button onclick="st.rd=addd(\''+d+'\',-1);render()">← Previous</button><button onclick="st.rd=td();render()">Today</button><button onclick="st.rd=addd(\''+d+'\',1);render()">Next →</button></div><input type="date" value="'+d+'" onchange="st.rd=this.value||td();render()"><div id="gd"><div style="text-align:center;margin-bottom:8px"><b style="font-size:18px">'+esc(db.shop.name)+'</b><br><small>'+esc(db.shop.addr)+'</small><br><b>DAILY REPORT · '+d+'</b></div><div class="cards"><div class="stat wide"><small>Total sales ('+x.n+' receipts)</small><span class="num">UGX '+fm(x.t)+'</span></div>'+sc('Cash sales',by('Cash'))+sc('Mobile Money sales',by('Mobile Money'))+sc('Credit sales',by('Credit'))+sc('Credit payments received',col)+sc('Advances received',adv)+sc('Gross profit',x.g)+sc('Expenses',x.e)+'<div class="stat wide"><small>Net profit for the day</small><span class="num '+(x.net<0?'low':'ok')+'">UGX '+fm(x.net)+'</span></div>'+sc('Stock bought (full cost)',sum(buy,u=>u.q*ul(u)))+sc('Cash paid for stock',sum(db.U,u=>cashOut(u,d)))+sc('Owner drawings',dr)+'</div><h3>Products sold</h3>'+(rows.length?'<div class="tw"><table><tr><th>Product</th><th>Qty</th><th>Sales</th><th>Profit</th></tr>'+rows.map(([n,r])=>'<tr><td>'+esc(n)+'</td><td>'+r.q+'</td><td>'+fm(r.s)+'</td><td>'+fm(r.p)+'</td></tr>').join('')+'</table></div>':'<div class="empty">No sales on this day</div>')+'<h3>Receipts</h3>'+ss.map(s=>ln('#'+s.no+' '+esc(s.cust||'Walk-in'),s.items.map(i=>esc(i.n)+' ×'+i.q).join(', ')+' · '+s.pay+(s.time?' · '+s.time:'')+(s.by?' · '+esc(s.by):''),fm(tot(s)),'rcpt('+s.id+')')).join('')+'<h3>Sales by person who served</h3>'+(()=>{const m={};ss.forEach(s=>{const k=s.by||'(not recorded)';m[k]=(m[k]||0)+tot(s)});return Object.entries(m).map(([k,v])=>ln(esc(k),'',fm(v))).join('')})()+'<h3>Expenses</h3>'+(ex.map(z=>ln(esc(z.desc||z.type),esc(z.type),fm(z.amt))).join('')||'<small>None</small>')+'<h3>Stock received</h3>'+(buy.map(u=>ln(esc(u.n),u.q+' @ '+fm(ul(u))+' · '+esc(u.sup||''),fm(u.q*ul(u)))).join('')||'<small>None</small>')+'<h3>Cash book</h3>'+(cl?ln(cl.cc-cb.c==0?'Closed · Balanced':(cl.cc<cb.c?'Closed · Short by ':'Closed · Over by ')+fm(Math.abs(cl.cc-cb.c)),'Counted cash '+fm(cl.cc)+' · expected '+fm(cb.c),fm(cl.cc)):ln('Not closed yet','Expected cash in the box: '+fm(cb.c),fm(cb.c))+'<button class="btn np" onclick="st.cd=\''+d+'\';nav(\'money\',\'cb\')">Go to Cash book</button>')+'</div><button class="btn big np" onclick="print()">Print daily report</button>'}
function plist(){const q=st.q.toLowerCase(),m=stk(),el=$('#pl');if(!el)return;
el.innerHTML=db.P.filter(p=>p.name.toLowerCase().includes(q)).slice(0,q?20:6).map(p=>'<button class="item" onclick="add('+p.id+')"><span class="nm"><b>'+esc(p.name)+'</b><small>'+m[p.name]+' '+p.unit+' in stock</small></span><span class="pr">'+fm(p.price)+'</span></button>').join('')}
function add(i){const p=db.P.find(x=>x.id==i),l=st.cart.find(x=>x.n==p.name);if(l)l.q++;else st.cart.push({n:p.name,q:1,p:p.price,c:costNow(p)});st.q='';render()}
function pmc(e){$('#pnw').classList.toggle('hide',e.value!='Credit')}
const nowt=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function sbx(){const L=db.staff||[];return '<label>Served by</label>'+(L.length?'<select id="sb"><option value="">(not recorded)</option>'+L.map(n=>'<option'+(n==db.lastSb?' selected':'')+'>'+esc(n)+'</option>').join('')+'</select>':'<input id="sb" placeholder="Name of the person serving (optional)" value="'+esc(db.lastSb||'')+'">')}
function done(){const cu=$('#cu').value.trim(),pay=$('#pm').value;if(pay=='Credit'&&!cu)return alert('Enter the customer name for a credit sale.');
if(st.cart.some(i=>!(i.q>0)))return alert('Check quantities.');const T=sum(st.cart,i=>i.q*i.p),a=st.adv&&db.A.find(x=>x.id==st.adv),ap=a?Math.min(abal(a),T):0,pn=pay=='Credit'?+($('#pn')?.value)||0:0;if(pn<0||pn>T-ap)return alert('Amount paid now must be between 0 and '+fm(T-ap)+'.');
const s={id:id(),no:Math.max(0,...db.S.map(x=>+x.no||0))+1,date:$('#sd').value||td(),time:$('#stm').value||nowt(),by:($('#sb')?.value||'').trim(),cust:cu,pay,pays:[],items:st.cart.map(i=>({...i}))};if(pn>0)s.pays.push({d:s.date,a:pn});if(ap>0){s.advId=a.id;s.advA=ap}db.lastSb=s.by;st.adv=null;db.S.push(s);st.cart=[];save();render();rcpt(s.id);toast('Sale saved ✓')}
